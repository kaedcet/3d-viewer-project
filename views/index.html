<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier Model Explorer</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#eef0f5;--muted:#a7afbd;--panel:#1d222c;--line:rgba(255,255,255,.11);--accent:#ff4c4c}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#12161d;color:var(--ink);font-family:Manrope,system-ui,sans-serif}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(18,22,29,.92)}.brand{display:flex;align-items:center;gap:10px;letter-spacing:.035em;font-size:13px;font-weight:800}.brand-mark{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px rgba(255,76,76,.85)}.project{color:var(--muted);font:11px 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;height:calc(100vh - 66px)}#viewer{min-width:0;position:relative;overflow:hidden;background:radial-gradient(circle at 48% 47%,#323b4b 0,#202733 26%,#141920 67%)}#viewer:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:36px 36px;transform:perspective(500px) rotateX(60deg) scale(2) translateY(48%);transform-origin:center bottom}.toolbox{position:absolute;top:18px;right:18px;z-index:5;display:flex;gap:8px}.tool{width:35px;height:35px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:rgba(24,29,38,.8);color:var(--ink);cursor:pointer;font:16px Manrope,sans-serif}.tool:hover{background:#303846}.canvas-help{position:absolute;left:22px;bottom:19px;z-index:3;color:#c2c9d3;font:11px 'DM Mono',monospace;pointer-events:none}aside{overflow:auto;background:var(--panel);border-left:1px solid var(--line)}.story{padding:29px 26px 18px;border-bottom:1px solid var(--line)}.eyebrow{color:#ff8989;font:10px 'DM Mono',monospace;letter-spacing:.13em;text-transform:uppercase}h1{margin:10px 0;font-size:25px;letter-spacing:-.045em;line-height:1.05}.summary{margin:0;color:var(--muted);font-size:13px;line-height:1.62}.progress{display:flex;gap:5px;margin-top:22px}.progress i{flex:1;height:3px;border-radius:8px;background:#4a5260}.progress i:first-child{background:var(--accent)}.points-head{display:flex;justify-content:space-between;padding:20px 26px 12px;color:var(--muted);font:10px 'DM Mono',monospace;letter-spacing:.11em;text-transform:uppercase}.points{padding:0 15px 22px;display:grid;gap:6px}.point{width:100%;display:grid;grid-template-columns:29px 1fr 16px;gap:11px;align-items:center;padding:13px 11px;border:1px solid transparent;border-radius:11px;background:transparent;color:inherit;text-align:left;cursor:pointer}.point:hover,.point.active{background:rgba(255,255,255,.055);border-color:var(--line)}.point.active{border-color:rgba(255,76,76,.42)}.num{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:#fff;font:600 11px 'DM Mono',monospace;box-shadow:0 0 0 4px rgba(255,76,76,.12)}.point-title{display:block;font-size:13px;font-weight:700}.point-desc{display:block;margin-top:2px;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{color:var(--muted);font-size:17px}#loading{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#161b23;transition:opacity .35s}.done{opacity:0;pointer-events:none}.spinner{width:35px;height:35px;border:2px solid rgba(255,255,255,.16);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}.bar{width:160px;height:3px;margin-top:17px;overflow:hidden;background:#343b46;border-radius:5px}.bar div{height:100%;width:0;background:var(--accent)}.loadtext{margin-top:11px;color:var(--muted);font:11px 'DM Mono',monospace}@keyframes spin{to{transform:rotate(360deg)}}.luxury-pin{position:relative;width:25px;height:25px;border:2px solid rgba(255,255,255,.92);border-radius:50%;background:radial-gradient(circle at 30% 28%,#ff8d8d,#ef3636 58%,#9d0e19);box-shadow:0 5px 17px rgba(255,45,45,.55),inset 0 2px 3px rgba(255,255,255,.5);cursor:pointer;pointer-events:auto}.luxury-pin:after{content:"";position:absolute;inset:-7px;border:1px solid rgba(255,100,100,.62);border-radius:50%;animation:pulse 2.1s infinite}.luxury-pin .pin-tooltip{position:absolute;left:34px;top:3px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:rgba(19,23,30,.94);color:#fff;font-size:11px;white-space:nowrap;opacity:0;transition:.2s;pointer-events:none}.luxury-pin:hover .pin-tooltip{opacity:1}@keyframes pulse{0%,100%{opacity:.9;transform:scale(.8)}60%{opacity:0;transform:scale(1.45)}}@media(max-width:760px){body{overflow:auto}.project{display:none}.layout{display:block;height:auto;min-height:calc(100vh - 66px)}#viewer{height:60vh;min-height:380px}aside{border-left:0;border-top:1px solid var(--line)}}
</style></head><body>
<header class="topbar"><div class="brand"><span class="brand-mark"></span>ATELIER / MODEL EXPLORER</div><span id="project-name" class="project">3D project</span></header><main class="layout"><section id="viewer" aria-label="โมเดล 3 มิติ"><div class="toolbox"><button id="reset-view" class="tool" title="รีเซ็ตมุมมอง">↺</button><button id="toggle-pins" class="tool" title="แสดงหรือซ่อนหมุด">◉</button><button id="fullscreen" class="tool" title="เต็มหน้าจอ">⛶</button></div><span class="canvas-help">ลากเพื่อหมุน · เลื่อนเพื่อซูม</span><div id="loading"><div class="spinner"></div><div class="bar"><div id="progress-bar"></div></div><div id="loading-text" class="loadtext">กำลังเตรียมโมเดล...</div></div></section><aside><section class="story"><div id="point-state" class="eyebrow">Explore points · 0 / 0</div><h1 id="story-title">กำลังโหลดโมเดล</h1><p id="story-desc" class="summary">กำลังเชื่อมต่อรายละเอียดของโครงการและจุดสำคัญ</p><div id="progress" class="progress"></div></section><div class="points-head"><span>จุดสำคัญ</span><span id="point-count">0 จุด</span></div><div id="annotations-list" class="points"></div></aside></main>
<script type="module">
import{createViewer}from'./js/viewer-core.js';const $=s=>document.querySelector(s),v=createViewer($('#viewer'));let annotations=[],initialView,pinsVisible=true;const story=i=>{const a=annotations[i];if(!a)return;$('#point-state').textContent=`Explore points · ${i+1} / ${annotations.length}`;$('#story-title').textContent=a.title||`จุดที่ ${i+1}`;$('#story-desc').textContent=a.description??a.desc??'ไม่มีคำอธิบาย';document.querySelectorAll('.point').forEach((e,n)=>e.classList.toggle('active',n===i))},focus=(a,i)=>{const t=a.view?.target??a.target,p=a.view?.position??a.cameraPos;if(t)v.controls.target.set(...t);if(p)v.camera.position.set(...p);v.controls.update();story(i)};function render(){const list=$('#annotations-list');list.replaceChildren();$('#point-count').textContent=`${annotations.length} จุด`;const progress=$('#progress');progress.replaceChildren(...annotations.map(()=>document.createElement('i')));annotations.forEach((a,i)=>{const p=a.position??a.pos;if(!Array.isArray(p)||p.length!==3)return;v.addAnnotation(a.title||`จุดที่ ${i+1}`,a.description??a.desc??'',p,()=>focus(a,i));const card=document.createElement('button');card.className='point';card.innerHTML=`<span class="num">${i+1}</span><span><span class="point-title"></span><span class="point-desc"></span></span><span class="arrow">›</span>`;card.querySelector('.point-title').textContent=a.title||`จุดที่ ${i+1}`;card.querySelector('.point-desc').textContent=a.description??a.desc??'ไม่มีคำอธิบาย';card.onclick=()=>focus(a,i);list.append(card)});if(annotations.length)story(0)}async function init(){try{const r=await fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({modelId:'single'})});if(!r.ok)throw Error('session');const{token,key,modelId}=await r.json();$('#project-name').textContent=`MODEL / ${modelId}`;await v.load(token,key,p=>{$('#progress-bar').style.width=`${p*100}%`;$('#loading-text').textContent=`กำลังโหลดโมเดล... ${Math.round(p*100)}%`});initialView={position:v.camera.position.toArray(),target:v.controls.target.toArray()};const file=await fetch(`/annotations/${encodeURIComponent(modelId)}.json`);if(file.ok){const d=await file.json();annotations=Array.isArray(d)?d:d.annotations||[]}render();$('#loading').classList.add('done')}catch(e){$('#loading-text').textContent='ไม่สามารถโหลดโมเดลได้';console.error(e)}}$('#reset-view').onclick=()=>{if(initialView){v.camera.position.fromArray(initialView.position);v.controls.target.fromArray(initialView.target);v.controls.update()}};$('#toggle-pins').onclick=()=>{pinsVisible=!pinsVisible;document.querySelectorAll('.luxury-pin').forEach(p=>p.style.display=pinsVisible?'':'none')};$('#fullscreen').onclick=()=>$('#viewer').requestFullscreen?.();init();
</script></body></html>
